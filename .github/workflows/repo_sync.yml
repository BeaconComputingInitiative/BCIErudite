name: Erudite verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'streamlit>=1.40,<2'
      - run: python scripts/verify_hashes.py
      - run: python -m unittest discover -s tests -v
# Source-only CI excludes private datasets and local model artifacts.
# No automatic public upload, commit, or repository synchronization is performed.
